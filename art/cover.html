<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(1200px 700px at 78% 22%, #022C22 0%, #021E17 55%, #010B08 100%);
    color: #fff; overflow: hidden; position: relative;
  }
  .wrap { display: flex; height: 100%; align-items: center; padding: 0 92px; gap: 64px; }
  .copy { max-width: 660px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: #A7F3D0; margin-bottom: 26px;
  }
  .eyebrow .dot { width: 12px; height: 12px; border-radius: 50%; background: #34D399; box-shadow: 0 0 18px #34D399; }
  h1 { font-size: 78px; line-height: 1.02; font-weight: 800; letter-spacing: -.02em; }
  h1 .accent { background: linear-gradient(90deg,#6EE7B7,#34D399); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: 28px; font-size: 30px; line-height: 1.35; color: #CBD5E1; font-weight: 400; }
  .badges { margin-top: 40px; display: flex; gap: 14px; }
  .badge { font-size: 22px; font-weight: 600; padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #D1FAE5; white-space: nowrap; }
  .art { flex: 1; display: flex; align-items: center; justify-content: center; }
  .glyph { width: 360px; height: 360px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.45)); }
  .corner { position: absolute; right: -120px; bottom: -160px; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(52,211,153,.28), transparent 60%); }
</style>
</head>
<body>
  <div class="corner"></div>
  <div class="wrap">
    <div class="copy">
      <span class="eyebrow"><span class="dot"></span>Statamic Addon</span>
      <h1>Statamic<br><span class="accent">Events</span></h1>
      <p class="sub">Events with any number of dates, per-event timezones, venues, ICS downloads and a subscribable feed.</p>
      <div class="badges">
        <span class="badge">Multi-date</span>
        <span class="badge">Timezones</span>
        <span class="badge">ICS feed</span>
      </div>
    </div>
    <div class="art">
      <svg class="glyph" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop stop-color="#34D399"/><stop offset="1" stop-color="#047857"/>
          </linearGradient>
          <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#022C22" flood-opacity="0.32"/>
          </filter>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#bg)"/>
        <rect x="168" y="104" width="26" height="64" rx="13" fill="#FFFFFF"/>
        <rect x="318" y="104" width="26" height="64" rx="13" fill="#FFFFFF"/>
        <!-- one date filled in: an event has many, a reader wants one -->
        <g filter="url(#sh)">
          <rect x="100" y="148" width="312" height="272" rx="36" fill="#FFFFFF"/>
        </g>
        <rect x="100" y="214" width="312" height="10" fill="url(#bg)" opacity="0.25"/>
        <g fill="url(#bg)" opacity="0.35">
          <rect x="136" y="250" width="36" height="30" rx="10"/>
          <rect x="204" y="250" width="36" height="30" rx="10"/>
          <rect x="272" y="250" width="36" height="30" rx="10"/>
          <rect x="340" y="250" width="36" height="30" rx="10"/>
          <rect x="136" y="306" width="36" height="30" rx="10"/>
          <rect x="204" y="306" width="36" height="30" rx="10"/>
          <rect x="340" y="306" width="36" height="30" rx="10"/>
          <rect x="136" y="362" width="36" height="30" rx="10"/>
          <rect x="204" y="362" width="36" height="30" rx="10"/>
          <rect x="272" y="362" width="36" height="30" rx="10"/>
          <rect x="340" y="362" width="36" height="30" rx="10"/>
        </g>
        <rect x="272" y="306" width="36" height="30" rx="10" fill="url(#bg)"/>
      </svg>
    </div>
  </div>
</body>
</html>
